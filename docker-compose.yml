
name: ganabosques

services:

  mongo:
    image: mongo:8.0.16

    container_name: ganabosques-mongo

    restart: unless-stopped

    volumes:
      - ${GANABOSQUES_DATA}/mongo:/data/db

    ports:
      - ${MONGO_PORT}:27017

    networks:
      - ganabosques

  postgres:
    image: postgres:15

    container_name: ganabosques-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}

      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - ${GANABOSQUES_DATA}/postgres:/var/lib/postgresql/data

    networks:
      - ganabosques

  keycloak:
    image: quay.io/keycloak/keycloak:26.2.5

    container_name: ganabosques-keycloak

    restart: unless-stopped

    command:
      - start
      - --import-realm

    depends_on:
      - postgres

    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}
      KC_HOSTNAME: ${SUBDOMAIN_KEYCLOAK}.${DOMAIN}
      KC_HOSTNAME_PORT: ${KEYCLOAK_PORT}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded

    volumes:
      - ${GANABOSQUES_DATA}/keycloak/themes:/opt/keycloak/data/themes
      - ${GANABOSQUES_DATA}/keycloak/import:/opt/keycloak/data/import

    ports:
      - ${KEYCLOAK_PORT}:8080

    networks:
      - ganabosques

  geoserver:
    image: docker.osgeo.org/geoserver:2.23.x

    container_name: ganabosques-geoserver

    restart: unless-stopped

    environment:
      GEOSERVER_ADMIN_USER: ${GEO_USER}

      GEOSERVER_ADMIN_PASSWORD: ${GEO_PWD}

      ROOT_WEBAPP_REDIRECT: 'true'

    ports:
      - ${GEOSERVER_PORT}:8080

    volumes:
      - ${GANABOSQUES_DATA}/geoserver:/opt/geoserver/data_dir

    networks:
      - ganabosques

  api:
    build:
      context: ./repos/ganabosques-api

    image: ganabosques-api

    container_name: ganabosques-api

    restart: unless-stopped

    env_file:
      - ./repos/ganabosques-api/.env

    depends_on:
      - mongo
      - keycloak

    ports:
      - ${API_PORT}:8000

    networks:
      - ganabosques

  web-admin:
    build:
      context: ./repos/ganabosques-web-admin

    image: ganabosques-web-admin

    container_name: ganabosques-web-admin

    restart: unless-stopped

    env_file:
      - ./repos/ganabosques-web-admin/.env

    depends_on:
      - api
      - mongo
      - geoserver
      - keycloak

    ports:
      - ${WEB_ADMIN_PORT}:5000

    networks:
      - ganabosques

  app:
    build:
      context: ./repos/ganabosques-app

    image: ganabosques-app

    container_name: ganabosques-app

    restart: unless-stopped

    depends_on:
      - api

    ports:
      - ${APP_PORT}:3000

    networks:
      - ganabosques

  etls:
    build:
      context: ./repos/ganabosques-etls

      args:
        GITHUB_TOKEN: ${GITHUB_TOKEN}

    image: ganabosques-etls

    container_name: ganabosques-etls

    restart: unless-stopped

    env_file:
      - ./repos/ganabosques-etls/.env

    volumes:
      - ${GANABOSQUES_DATA}/workspace:/workspace

    depends_on:
      - mongo
      - geoserver

    networks:
      - ganabosques

  nginx:

    image: nginx:latest

    container_name: ganabosques-nginx

    restart: unless-stopped

    depends_on:
      - app
      - api
      - keycloak
      - geoserver
      - web-admin

    ports:
      - ${NGINX_PORT}:80

    volumes:
      - ${GANABOSQUES_DATA}/nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    networks:

      ganabosques:

        aliases:

          - ${SUBDOMAIN_KEYCLOAK}.${DOMAIN}
          - ${SUBDOMAIN_API}.${DOMAIN}
          - ${SUBDOMAIN_GEOSERVER}.${DOMAIN}
          - ${SUBDOMAIN_WEB_ADMIN}.${DOMAIN}
          - ${SUBDOMAIN_APP}.${DOMAIN}

# NETWORK

networks:
  ganabosques:
    driver: bridge
